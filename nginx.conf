server {
    listen 80;
    server_name _;

    # Root for static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/xml application/xml application/xml+rss;
    gzip_min_length 1000;
    gzip_vary on;

    # SPA: serve index.html for all routes that don't match a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache for 1 year (they have content hashes)
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: no cache (always check for new version)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
